plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'app.sada.poc'
    compileSdk 34

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        // Developer-only: the Sada server the app talks to. Change it with the SADA_SERVER environment variable
        // (GitHub: Settings > Secrets and variables > Actions > Variables > SADA_SERVER) and rebuild.
        buildConfigField "String", "SADA_SERVER", "\"${System.getenv('SADA_SERVER') ?: 'https://sada-chi.vercel.app'}\""
        applicationId 'app.sada.poc'
        minSdk 26
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')
        versionName "0.0.${System.getenv('VERSION_CODE') ?: '1'}-stage0"
        ndk {
            // Infinix Hot 40 Pro is a 64-bit ARM phone; one ABI keeps the APK small.
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    lint {
        abortOnError = false
        checkReleaseBuilds = false
    }
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
